[build]
  command = "npm i --no-save --no-audit --no-fund @rollup/rollup-linux-x64-gnu@4.65.0 @esbuild/linux-x64@0.28.2 && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://staylocal-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
